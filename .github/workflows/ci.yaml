name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [aws, bootstrap]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: fmt check
        run: terraform -chdir=terraform/${{ matrix.dir }} fmt -check -diff

      - name: init (no backend)
        run: terraform -chdir=terraform/${{ matrix.dir }} init -backend=false

      - name: validate
        run: terraform -chdir=terraform/${{ matrix.dir }} validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform on cluster manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -summary -strict
            -ignore-missing-schemas
            k8s/clusters/lab/monitoring

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [healthpoller, logmetrics]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r python-tools/${{ matrix.tool }}/requirements.txt

      - name: pytest
        run: pytest python-tools/${{ matrix.tool }}